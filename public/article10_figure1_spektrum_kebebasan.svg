<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headerGrad10" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="spectrumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="627" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>

  <!-- TOP HEADER -->
  <g transform="translate(60, 60)">
    <!-- Badge -->
    <rect width="260" height="28" rx="6" fill="#e0f2fe"/>
    <text x="12" y="19" fill="#0369a1" font-size="11" font-weight="800" font-mono="true" letter-spacing="1">
      GAMBAR 1 &#8226; DOKTRIN DESAIN INDUSTRI
    </text>

    <!-- Title -->
    <text x="0" y="62" fill="#0f172a" font-size="28" font-weight="800" letter-spacing="-0.5">
      Skema Tingkat Kebebasan Desainer (Degree of Design Freedom)
    </text>
    
    <!-- Rule Statement -->
    <text x="0" y="90" fill="#64748b" font-size="14" font-weight="500">
      Prinsip Yuridis: <tspan fill="#0284c7" font-weight="700">Makin terkunci oleh fungsi teknis &amp; standar</tspan>, makin sempit cakupan perlindungannya.
    </text>
  </g>

  <!-- 5 PRODUCT CARDS GRID (Middle) -->
  <g transform="translate(60, 180)">

    <!-- CARD 1: KURSI -->
    <g transform="translate(0, 0)">
      <rect width="200" height="305" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#softShadow)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 186 0 C 193.73 0 200 6.27 200 14 L 200 36 L 0 36 Z" fill="#ecfdf5"/>
      <text x="100" y="23" fill="#047857" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">KEBEBASAN BESAR</text>

      <!-- Illustration: Chair -->
      <g transform="translate(50, 55)">
        <rect width="100" height="90" rx="10" fill="#f0fdf4"/>
        <path d="M 32 30 L 32 62 M 32 48 L 68 48 M 68 48 L 68 75 M 32 62 L 32 75 M 36 28 C 36 24 64 24 64 28 L 64 48" 
              fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <text x="100" y="172" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">Kursi &amp; Sofa</text>
      <text x="100" y="194" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">Cakupan Luas</text>
      
      <line x1="20" y1="210" x2="180" y2="210" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="100" y="232" fill="#475569" font-size="11" text-anchor="middle">Bentuk lekukan &amp; kaki</text>
      <text x="100" y="248" fill="#475569" font-size="11" text-anchor="middle">sangat bebas dieksplorasi</text>
      <text x="100" y="264" fill="#64748b" font-size="10" text-anchor="middle">tanpa hambatan fungsi.</text>
      
      <rect x="25" y="278" width="150" height="18" rx="4" fill="#d1fae5"/>
      <text x="100" y="291" fill="#065f46" font-size="9" font-weight="700" text-anchor="middle">Kesan Beda: Mudah Tercapai</text>
    </g>

    <!-- CARD 2: TAS TANGAN -->
    <g transform="translate(220, 0)">
      <rect width="200" height="305" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#softShadow)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 186 0 C 193.73 0 200 6.27 200 14 L 200 36 L 0 36 Z" fill="#ecfdf5"/>
      <text x="100" y="23" fill="#047857" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">KEBEBASAN BESAR</text>

      <!-- Illustration: Handbag -->
      <g transform="translate(50, 55)">
        <rect width="100" height="90" rx="10" fill="#f0fdf4"/>
        <path d="M 40 40 C 40 28 60 28 60 40 M 28 40 L 72 40 L 76 74 L 24 74 Z" 
              fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="50" cy="54" r="3" fill="#059669"/>
      </g>

      <text x="100" y="172" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">Tas Tangan</text>
      <text x="100" y="194" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">Cakupan Luas</text>
      
      <line x1="20" y1="210" x2="180" y2="210" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="100" y="232" fill="#475569" font-size="11" text-anchor="middle">Sedikit batasan teknis;</text>
      <text x="100" y="248" fill="#475569" font-size="11" text-anchor="middle">pesaing wajib menjauh</text>
      <text x="100" y="264" fill="#64748b" font-size="10" text-anchor="middle">(H&amp;M v YSL 2011).</text>

      <rect x="25" y="278" width="150" height="18" rx="4" fill="#d1fae5"/>
      <text x="100" y="291" fill="#065f46" font-size="9" font-weight="700" text-anchor="middle">Monopoli Gaya Luas</text>
    </g>

    <!-- CARD 3: SEPATU -->
    <g transform="translate(440, 0)">
      <rect width="200" height="305" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5" filter="url(#softShadow)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 186 0 C 193.73 0 200 6.27 200 14 L 200 36 L 0 36 Z" fill="#fffbeb"/>
      <text x="100" y="23" fill="#b45309" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">KEBEBASAN SEDANG</text>

      <!-- Illustration: Shoe -->
      <g transform="translate(50, 55)">
        <rect width="100" height="90" rx="10" fill="#fef3c7"/>
        <path d="M 24 64 C 30 64 36 60 44 48 C 48 42 58 40 68 46 L 76 60 L 76 68 L 24 68 Z" 
              fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="24" y1="68" x2="76" y2="68" stroke="#b45309" stroke-width="3"/>
      </g>

      <text x="100" y="172" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">Sepatu &amp; Sandal</text>
      <text x="100" y="194" fill="#d97706" font-size="11" font-weight="700" text-anchor="middle">Cakupan Menengah</text>
      
      <line x1="20" y1="210" x2="180" y2="210" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="100" y="232" fill="#475569" font-size="11" text-anchor="middle">Mengikuti anatomi kaki,</text>
      <text x="100" y="248" fill="#475569" font-size="11" text-anchor="middle">namun motif, outsole,</text>
      <text x="100" y="264" fill="#64748b" font-size="10" text-anchor="middle">&amp; jahitan bervariasi.</text>

      <rect x="25" y="278" width="150" height="18" rx="4" fill="#fef3c7"/>
      <text x="100" y="291" fill="#92400e" font-size="9" font-weight="700" text-anchor="middle">Terikat Ergonomi Anatomi</text>
    </g>

    <!-- CARD 4: SMARTPHONE -->
    <g transform="translate(660, 0)">
      <rect width="200" height="305" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#softShadow)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 186 0 C 193.73 0 200 6.27 200 14 L 200 36 L 0 36 Z" fill="#fef2f2"/>
      <text x="100" y="23" fill="#b91c1c" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">KEBEBASAN KECIL</text>

      <!-- Illustration: Phone -->
      <g transform="translate(50, 55)">
        <rect width="100" height="90" rx="10" fill="#fee2e2"/>
        <rect x="34" y="24" width="32" height="52" rx="6" fill="none" stroke="#dc2626" stroke-width="2.5"/>
        <line x1="45" y1="30" x2="55" y2="30" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
        <circle cx="50" cy="68" r="2" fill="#dc2626"/>
      </g>

      <text x="100" y="172" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">Ponsel Pintar</text>
      <text x="100" y="194" fill="#dc2626" font-size="11" font-weight="700" text-anchor="middle">Cakupan Sempit</text>
      
      <line x1="20" y1="210" x2="180" y2="210" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="100" y="232" fill="#475569" font-size="11" text-anchor="middle">Layar datar, genggam tangan,</text>
      <text x="100" y="248" fill="#475569" font-size="11" text-anchor="middle">komponen standar.</text>
      <text x="100" y="264" fill="#64748b" font-size="10" text-anchor="middle">(Apple v Samsung 2012).</text>

      <rect x="25" y="278" width="150" height="18" rx="4" fill="#fee2e2"/>
      <text x="100" y="291" fill="#991b1b" font-size="9" font-weight="700" text-anchor="middle">Beda Kecil Sudah Berarti</text>
    </g>

    <!-- CARD 5: LEGO BRICK -->
    <g transform="translate(880, 0)">
      <rect width="200" height="305" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="1.5" filter="url(#softShadow)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 186 0 C 193.73 0 200 6.27 200 14 L 200 36 L 0 36 Z" fill="#fef2f2"/>
      <text x="100" y="23" fill="#b91c1c" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">KEBEBASAN KECIL</text>

      <!-- Illustration: Lego -->
      <g transform="translate(50, 55)">
        <rect width="100" height="90" rx="10" fill="#fee2e2"/>
        <rect x="30" y="42" width="40" height="28" rx="2" fill="none" stroke="#dc2626" stroke-width="2.5"/>
        <rect x="35" y="36" width="10" height="6" fill="#dc2626"/>
        <rect x="55" y="36" width="10" height="6" fill="#dc2626"/>
      </g>

      <text x="100" y="172" fill="#0f172a" font-size="15" font-weight="800" text-anchor="middle">Balok LEGO</text>
      <text x="100" y="194" fill="#dc2626" font-size="11" font-weight="700" text-anchor="middle">Cakupan Sempit</text>
      
      <line x1="20" y1="210" x2="180" y2="210" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="100" y="232" fill="#475569" font-size="11" text-anchor="middle">Dikunci fungsi mekanis</text>
      <text x="100" y="248" fill="#475569" font-size="11" text-anchor="middle">saling mengunci modular</text>
      <text x="100" y="264" fill="#64748b" font-size="10" text-anchor="middle">(LEGO v EUIPO 2021).</text>

      <rect x="25" y="278" width="150" height="18" rx="4" fill="#fee2e2"/>
      <text x="100" y="291" fill="#991b1b" font-size="9" font-weight="700" text-anchor="middle">Interlocking Function</text>
    </g>

  </g>

  <!-- BOTTOM SPECTRUM BAR -->
  <g transform="translate(60, 510)">
    <rect width="1080" height="74" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Spectrum Bar Labels -->
    <text x="25" y="26" fill="#047857" font-size="12" font-weight="800">
      &#8592; Cakupan Perlindungan Lebih Luas
    </text>
    <text x="540" y="26" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle" font-mono="true">
      SPEKTRUM INVERSE PROPORTIONALITY (CJEU PASAL 10)
    </text>
    <text x="1055" y="26" fill="#b91c1c" font-size="12" font-weight="800" text-anchor="end">
      Cakupan Lebih Sempit, Detail Kecil Menentukan &#8594;
    </text>

    <!-- Colored Spectrum Bar -->
    <rect x="25" y="38" width="1030" height="14" rx="7" fill="url(#spectrumGrad)"/>
  </g>

  <!-- FOOTER SOURCE NOTE -->
  <g transform="translate(60, 615)">
    <text x="0" y="16" fill="#94a3b8" font-size="11" font-mono="true">
      Rujukan: CJEU H&amp;M v YSL [7], Birss J Apple v Samsung [5], CJEU LEGO [9], EUIPO Guidelines [2] &#8226; Kajian IDE Indonesia oleh Arif Reza Basirun
    </text>
  </g>
</svg>
