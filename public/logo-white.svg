<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- INDUSTRIAL DESIGN EXAMINER - EMBLEM MARK (DARK BACKGROUND) -->
  <g transform="translate(50, 50)">
    <!-- Top-Left Semicircular Yellow Arc (Letter D) -->
    <path
      d="M -26 26 A 37 37 0 0 1 26 -26"
      fill="none"
      stroke="#F5A800"
      stroke-width="6.5"
      stroke-linecap="round"
    />

    <!-- Diagonal Double-Stripe Yellow Bar -->
    <line
      x1="-38"
      y1="38"
      x2="26"
      y2="-26"
      stroke="#F5A800"
      stroke-width="3.8"
      stroke-linecap="round"
      transform="translate(-2.5, -2.5)"
    />
    <line
      x1="-40"
      y1="40"
      x2="24"
      y2="-24"
      stroke="#F5A800"
      stroke-width="4.2"
      stroke-linecap="round"
      transform="translate(2.5, 2.5)"
    />
    <path
      d="M -40.5 35.5 A 3.5 3.5 0 0 0 -35.5 42.5"
      fill="none"
      stroke="#F5A800"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Bottom-Right Semicircular White Arc (Letter E) -->
    <path
      d="M 26 -26 A 37 37 0 0 1 -26 26"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Internal White Spoke -->
    <line
      x1="0"
      y1="0"
      x2="25"
      y2="25"
      stroke="#FFFFFF"
      stroke-width="5.5"
      stroke-linecap="round"
    />
  </g>
</svg>