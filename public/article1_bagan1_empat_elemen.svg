<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="cardShadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="627" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow1)"/>

  <!-- TOP HEADER -->
  <g transform="translate(60, 58)">
    <rect width="270" height="28" rx="6" fill="#e0f2fe"/>
    <text x="12" y="19" fill="#0369a1" font-size="11" font-weight="800" font-mono="true" letter-spacing="1">
      BAGAN 1 &#8226; PASAL 1 ANGKA 1 UU 31/2000
    </text>

    <text x="0" y="60" fill="#0f172a" font-size="28" font-weight="800" letter-spacing="-0.5">
      Taksonomi Empat Pilar Yuridis Rupa Desain Industri
    </text>
    <text x="0" y="86" fill="#64748b" font-size="14" font-weight="500">
      Batasan Hukum Positif Perlindungan Penampilan Estetis Produk Komersial &amp; Uji Kebaruan Substantif
    </text>
  </g>

  <!-- 4 STATUTORY PILLARS CARDS (Grid 4 Columns) -->
  <g transform="translate(60, 168)">

    <!-- PILLAR 1: BENTUK -->
    <g transform="translate(0, 0)">
      <rect width="255" height="315" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#cardShadow1)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 241 0 C 248.73 0 255 6.27 255 14 L 255 38 L 0 38 Z" fill="#f0f9ff"/>
      <text x="127" y="24" fill="#0369a1" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">PILAR 1 &#8226; SHAPE 3D</text>

      <!-- Isometric 3D Solid Mass Graphic -->
      <g transform="translate(67, 55)">
        <rect width="120" height="95" rx="10" fill="#f0f9ff"/>
        <polygon points="60,15 105,38 60,60 15,38" fill="#38bdf8" stroke="#0284c7" stroke-width="2"/>
        <polygon points="15,38 60,60 60,105 15,83" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
        <polygon points="60,60 105,38 105,83 60,105" fill="#0369a1" stroke="#075985" stroke-width="2"/>
      </g>

      <text x="127" y="180" fill="#0f172a" font-size="16" font-weight="800" text-anchor="middle">Bentuk (Form 3D)</text>
      <text x="127" y="200" fill="#0284c7" font-size="11" font-weight="700" text-anchor="middle">Massa Tiga Dimensi</text>

      <line x1="20" y1="216" x2="235" y2="216" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="127" y="238" fill="#475569" font-size="11" text-anchor="middle">Formasi volume &amp; kurva</text>
      <text x="127" y="254" fill="#475569" font-size="11" text-anchor="middle">geometris yang membungkus</text>
      <text x="127" y="270" fill="#64748b" font-size="10.5" text-anchor="middle">bodi teko, botol, casing.</text>

      <rect x="25" y="284" width="205" height="20" rx="4" fill="#e0f2fe"/>
      <text x="127" y="298" fill="#0369a1" font-size="9.5" font-weight="700" text-anchor="middle">Objek Fisik Berongga / Pejal</text>
    </g>

    <!-- PILLAR 2: KONFIGURASI -->
    <g transform="translate(275, 0)">
      <rect width="255" height="315" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="url(#cardShadow1)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 241 0 C 248.73 0 255 6.27 255 14 L 255 38 L 0 38 Z" fill="#eef2ff"/>
      <text x="127" y="24" fill="#4338ca" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">PILAR 2 &#8226; SPATIAL LAYOUT</text>

      <!-- Spatial Layout Diagram -->
      <g transform="translate(67, 55)">
        <rect width="120" height="95" rx="10" fill="#eef2ff"/>
        <rect x="20" y="15" width="35" height="30" rx="5" fill="#818cf8"/>
        <rect x="65" y="15" width="35" height="30" rx="5" fill="#6366f1"/>
        <rect x="20" y="55" width="80" height="30" rx="5" fill="#4f46e5"/>
        <line x1="37" y1="45" x2="37" y2="55" stroke="#a5b4fc" stroke-width="2"/>
        <line x1="82" y1="45" x2="82" y2="55" stroke="#a5b4fc" stroke-width="2"/>
      </g>

      <text x="127" y="180" fill="#0f172a" font-size="16" font-weight="800" text-anchor="middle">Konfigurasi</text>
      <text x="127" y="200" fill="#4f46e5" font-size="11" font-weight="700" text-anchor="middle">Susunan Antar-Komponen</text>

      <line x1="20" y1="216" x2="235" y2="216" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="127" y="238" fill="#475569" font-size="11" text-anchor="middle">Tata letak terpadu spasial;</text>
      <text x="127" y="254" fill="#475569" font-size="11" text-anchor="middle">hubungan proporsi posisi</text>
      <text x="127" y="270" fill="#64748b" font-size="10.5" text-anchor="middle">tombol, gagang &amp; rangka.</text>

      <rect x="25" y="284" width="205" height="20" rx="4" fill="#e0e7ff"/>
      <text x="127" y="298" fill="#3730a3" font-size="9.5" font-weight="700" text-anchor="middle">Integrasi Spasial Relasional</text>
    </g>

    <!-- PILLAR 3: KOMPOSISI GARIS -->
    <g transform="translate(550, 0)">
      <rect width="255" height="315" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="1.5" filter="url(#cardShadow1)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 241 0 C 248.73 0 255 6.27 255 14 L 255 38 L 0 38 Z" fill="#ecfdf5"/>
      <text x="127" y="24" fill="#047857" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">PILAR 3 &#8226; LINES &amp; RIBBING</text>

      <!-- Linear dynamic contour lines -->
      <g transform="translate(67, 55)">
        <rect width="120" height="95" rx="10" fill="#ecfdf5"/>
        <path d="M 18 25 Q 60 5 102 30" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
        <path d="M 18 45 Q 60 25 102 50" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 18 65 Q 60 45 102 70" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
        <path d="M 18 85 Q 60 65 102 90" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-dasharray="3 3"/>
      </g>

      <text x="127" y="180" fill="#0f172a" font-size="16" font-weight="800" text-anchor="middle">Komposisi Garis</text>
      <text x="127" y="200" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">Alur Motif 2D / 3D</text>

      <line x1="20" y1="216" x2="235" y2="216" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="127" y="238" fill="#475569" font-size="11" text-anchor="middle">Guratan alur aerodinamis,</text>
      <text x="127" y="254" fill="#475569" font-size="11" text-anchor="middle">tekstur ribbing permukaan,</text>
      <text x="127" y="270" fill="#64748b" font-size="10.5" text-anchor="middle">atau ornamen tapak ban.</text>

      <rect x="25" y="284" width="205" height="20" rx="4" fill="#d1fae5"/>
      <text x="127" y="298" fill="#065f46" font-size="9.5" font-weight="700" text-anchor="middle">Garis Dekoratif &amp; Profil Bodi</text>
    </g>

    <!-- PILLAR 4: KOMPOSISI WARNA -->
    <g transform="translate(825, 0)">
      <rect width="255" height="315" rx="14" fill="#ffffff" stroke="#d97706" stroke-width="1.5" filter="url(#cardShadow1)"/>
      <path d="M 0 14 C 0 6.27 6.27 0 14 0 L 241 0 C 248.73 0 255 6.27 255 14 L 255 38 L 0 38 Z" fill="#fffbeb"/>
      <text x="127" y="24" fill="#b45309" font-size="11" font-weight="800" text-anchor="middle" font-mono="true">PILAR 4 &#8226; CMF HARMONY</text>

      <!-- Color Palette Diagram -->
      <g transform="translate(67, 55)">
        <rect width="120" height="95" rx="10" fill="#fffbeb"/>
        <circle cx="45" cy="40" r="24" fill="#f59e0b"/>
        <circle cx="75" cy="40" r="24" fill="#ef4444" fill-opacity="0.9"/>
        <circle cx="60" cy="65" r="24" fill="#0284c7" fill-opacity="0.9"/>
        <circle cx="60" cy="48" r="10" fill="#ffffff"/>
      </g>

      <text x="127" y="180" fill="#0f172a" font-size="16" font-weight="800" text-anchor="middle">Komposisi Warna</text>
      <text x="127" y="200" fill="#d97706" font-size="11" font-weight="700" text-anchor="middle">Harmoni Pembagian Bidang</text>

      <line x1="20" y1="216" x2="235" y2="216" stroke="#f1f5f9" stroke-width="1.5"/>

      <text x="127" y="238" fill="#475569" font-size="11" text-anchor="middle">Kombinasi dual-tone terencana;</text>
      <text x="127" y="254" fill="#475569" font-size="11" text-anchor="middle">monopoli warna tunggal</text>
      <text x="127" y="270" fill="#64748b" font-size="10.5" text-anchor="middle">dilarang keras oleh hukum.</text>

      <rect x="25" y="284" width="205" height="20" rx="4" fill="#fef3c7"/>
      <text x="127" y="298" fill="#92400e" font-size="9.5" font-weight="700" text-anchor="middle">Minimal 2 Warna Harmonis</text>
    </g>

  </g>

  <!-- BOTTOM STRIP: PEMISAHAN REZIM PATEN VS DESAIN INDUSTRI -->
  <g transform="translate(60, 508)">
    <rect width="1080" height="85" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>

    <g transform="translate(25, 18)">
      <rect width="210" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
      <text x="15" y="24" fill="#065f46" font-size="11" font-weight="800">DESAIN INDUSTRI:</text>
      <text x="15" y="40" fill="#047857" font-size="11">Rupa Estetika Kasat Mata</text>
    </g>

    <g transform="translate(250, 18)">
      <rect width="210" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1"/>
      <text x="15" y="24" fill="#991b1b" font-size="11" font-weight="800">BUKAN PATEN:</text>
      <text x="15" y="40" fill="#b91c1c" font-size="11">Fungsi Teknis &amp; Mekanikal</text>
    </g>

    <g transform="translate(485, 20)">
      <text x="0" y="16" fill="#0f172a" font-size="12" font-weight="700">
        Prinsip Uji Kebaruan Substantif (Pasal 2 UU No. 31/2000):
      </text>
      <text x="0" y="36" fill="#475569" font-size="11.5">
        Penilaian tidak menguji kinerja mesin atau efisiensi alat, melainkan apakah terdapat perbedaan signifikan pada kesan visual keseluruhan dibanding pembanding terdahulu (*prior art*).
      </text>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(60, 620)">
    <text x="0" y="14" fill="#94a3b8" font-size="11" font-mono="true">
      Pasal 1 angka 1 &amp; Pasal 2 UU No. 31 Tahun 2000 &#8226; Seri Edukasi Pemeriksa Desain Industri DJKI &#8226; Oleh Arif Reza Basirun
    </text>
  </g>
</svg>
