<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0b0f19; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cyanGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roseGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Technical Cross Hatch Pattern -->
    <pattern id="crossGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.4"/>
      <circle cx="10" cy="10" r="0.8" fill="#64748b" opacity="0.3"/>
    </pattern>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad1)"/>
  <rect width="1200" height="675" fill="url(#crossGrid)"/>

  <!-- Atmospheric Glows -->
  <circle cx="600" cy="300" r="320" fill="#4f46e5" opacity="0.12" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="260" fill="#0284c7" opacity="0.1" filter="blur(70px)"/>

  <!-- Top Category Banner Tag -->
  <g transform="translate(60, 52)">
    <rect width="270" height="34" rx="17" fill="#4338ca" fill-opacity="0.3" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#818cf8"/>
    <text x="36" y="22" fill="#c7d2fe" font-size="12" font-weight="700" letter-spacing="1.5" text-transform="uppercase">HUKUM &amp; 4 ELEMEN YURIDIS</text>
  </g>

  <!-- Headline & Subtitle -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      Kajian Desain Industri &amp; Pengujian Kebaruan Substantif
    </text>
    <text x="0" y="32" fill="#94a3b8" font-size="16" font-weight="500">
      Taksonomi Empat Pilar Yuridis Pasal 1 UU 31/2000 &amp; Pemisahan Fungsi Teknis Paten
    </text>
  </g>

  <!-- THE 4 STATUTORY PILLARS CARDS (Grid 4 Columns) -->
  <g transform="translate(60, 205)">

    <!-- PILLAR 1: BENTUK (3D SHAPE) -->
    <g transform="translate(0, 0)">
      <rect width="255" height="230" rx="16" fill="#0f172a" stroke="#0284c7" stroke-width="1.4"/>
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 239 0 C 247.84 0 255 7.16 255 16 L 255 42 L 0 42 Z" fill="#0c2340"/>
      <text x="16" y="27" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1">1. BENTUK (SHAPE 3D)</text>

      <!-- Isometric 3D Shape Icon -->
      <g transform="translate(65, 60)">
        <polygon points="60,10 110,35 60,60 10,35" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.8"/>
        <polygon points="10,35 60,60 60,115 10,90" fill="#0369a1" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.8"/>
        <polygon points="60,60 110,35 110,90 60,115" fill="#075985" stroke="#38bdf8" stroke-width="1.8"/>
      </g>

      <text x="16" y="195" fill="#f8fafc" font-size="12" font-weight="700">Formasi Massa 3 Dimensi</text>
      <text x="16" y="213" fill="#94a3b8" font-size="10.5">Kontur lekukan bodi, teko &amp; geometri.</text>
    </g>

    <!-- PILLAR 2: KONFIGURASI (SPATIAL LAYOUT) -->
    <g transform="translate(275, 0)">
      <rect width="255" height="230" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.4"/>
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 239 0 C 247.84 0 255 7.16 255 16 L 255 42 L 0 42 Z" fill="#1e1b4b"/>
      <text x="16" y="27" fill="#a5b4fc" font-size="11" font-weight="800" letter-spacing="1">2. KONFIGURASI (LAYOUT)</text>

      <!-- Exploded / Spatial Layout Icon -->
      <g transform="translate(60, 60)">
        <rect x="15" y="10" width="45" height="45" rx="8" fill="#4338ca" stroke="#818cf8" stroke-width="1.5"/>
        <rect x="70" y="10" width="45" height="45" rx="8" fill="#4338ca" stroke="#818cf8" stroke-width="1.5"/>
        <rect x="15" y="65" width="100" height="45" rx="8" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
        <!-- Connection node lines -->
        <line x1="37" y1="55" x2="37" y2="65" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
        <line x1="92" y1="55" x2="92" y2="65" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="16" y="195" fill="#f8fafc" font-size="12" font-weight="700">Susunan Relasional Komponen</text>
      <text x="16" y="213" fill="#94a3b8" font-size="10.5">Tata letak terpadu antar-bagian produk.</text>
    </g>

    <!-- PILLAR 3: KOMPOSISI GARIS (LINES & RIBBING) -->
    <g transform="translate(550, 0)">
      <rect width="255" height="230" rx="16" fill="#0f172a" stroke="#059669" stroke-width="1.4"/>
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 239 0 C 247.84 0 255 7.16 255 16 L 255 42 L 0 42 Z" fill="#064e3b"/>
      <text x="16" y="27" fill="#6ee7b7" font-size="11" font-weight="800" letter-spacing="1">3. KOMPOSISI GARIS</text>

      <!-- Vector Dynamic Curves & Lines -->
      <g transform="translate(60, 60)">
        <path d="M 10 30 Q 65 5 120 40" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
        <path d="M 10 55 Q 65 30 120 65" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 10 80 Q 65 55 120 90" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round"/>
        <path d="M 10 105 Q 65 80 120 115" fill="none" stroke="#a7f3d0" stroke-width="1.5" stroke-dasharray="4 3"/>
      </g>

      <text x="16" y="195" fill="#f8fafc" font-size="12" font-weight="700">Guratan Motif Linear 2D / 3D</text>
      <text x="16" y="213" fill="#94a3b8" font-size="10.5">Alur aerodinamis &amp; ribbing permukaan.</text>
    </g>

    <!-- PILLAR 4: KOMPOSISI WARNA (CMF HARMONY) -->
    <g transform="translate(825, 0)">
      <rect width="255" height="230" rx="16" fill="#0f172a" stroke="#d97706" stroke-width="1.4"/>
      <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 239 0 C 247.84 0 255 7.16 255 16 L 255 42 L 0 42 Z" fill="#78350f"/>
      <text x="16" y="27" fill="#fcd34d" font-size="11" font-weight="800" letter-spacing="1">4. KOMPOSISI WARNA</text>

      <!-- Chromatic Spectrum Palette -->
      <g transform="translate(65, 60)">
        <circle cx="40" cy="40" r="30" fill="#f59e0b" fill-opacity="0.85"/>
        <circle cx="85" cy="40" r="30" fill="#ef4444" fill-opacity="0.85"/>
        <circle cx="62" cy="78" r="30" fill="#06b6d4" fill-opacity="0.85"/>
        <circle cx="62" cy="52" r="14" fill="#ffffff" fill-opacity="0.9"/>
      </g>

      <text x="16" y="195" fill="#f8fafc" font-size="12" font-weight="700">Kombinasi Kromatik Terencana</text>
      <text x="16" y="213" fill="#94a3b8" font-size="10.5">Harmoni CMF; monopoli warna tunggal dilarang.</text>
    </g>

  </g>

  <!-- BOTTOM EXAMINATION SEAL & PRINCIPLE BANNER -->
  <g transform="translate(60, 460)">
    <rect width="1080" height="125" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Left Badge: Novelty Examination Seal -->
    <g transform="translate(30, 22)">
      <rect width="260" height="80" rx="12" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.4"/>
      <!-- Seal Shield / Check Icon -->
      <circle cx="45" cy="40" r="22" fill="#0284c7"/>
      <path d="M 37 40 L 43 46 L 53 34" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="34" fill="#f8fafc" font-size="12" font-weight="800">UJI KEBARUAN</text>
      <text x="78" y="50" fill="#38bdf8" font-size="11" font-weight="700">SUBSTANTIF</text>
      <text x="78" y="66" fill="#94a3b8" font-size="9.5">Pasal 2 UU 31/2000 (Prior Art)</text>
    </g>

    <!-- Center & Right: Separation Doctrine -->
    <g transform="translate(320, 28)">
      <text x="0" y="16" fill="#ffffff" font-size="13" font-weight="700">
        BATASAN PEMISAHAN REZIM: KESAN ESTETIS VS FUNGSI MEKANIKAL
      </text>
      <text x="0" y="40" fill="#cbd5e1" font-size="11.5" line-height="1.4">
        Hak Desain Industri semata-mata melindungi bentuk rupa estetika yang kasat mata saat produk digunakan.
      </text>
      <text x="0" y="60" fill="#94a3b8" font-size="11">
        Kinerja mekanis, efisiensi tuas, atau sistem hidrolik mutlak ranah Paten dan bukan dasar penilaian kebaruan rupa desain industri.
      </text>
    </g>

  </g>

  <!-- Bottom Brand Mark -->
  <g transform="translate(60, 615)">
    <text x="0" y="18" fill="#475569" font-size="12" font-mono="true">
      IDE INDONESIA &#8226; SERI HUKUM &amp; PEMERIKSAAN SUBSTANTIF DESAIN INDUSTRI &#8226; OLEH ARIF REZA BASIRUN
    </text>
  </g>
</svg>
