<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090e17; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a101f"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- CAD Blueprint Grid Pattern -->
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" opacity="0.2"/>
    </pattern>
    <pattern id="cadGridSub" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8" fill="none" stroke="#1e293b" stroke-width="0.3" opacity="0.3"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGrad10)"/>
  <rect width="1200" height="675" fill="url(#cadGridSub)"/>
  <rect width="1200" height="675" fill="url(#cadGrid)"/>

  <!-- Radial lighting accent -->
  <circle cx="820" cy="300" r="320" fill="#0284c7" opacity="0.12" filter="blur(60px)"/>
  <circle cx="280" cy="480" r="280" fill="#d97706" opacity="0.08" filter="blur(60px)"/>

  <!-- Top Category Banner Tag -->
  <g transform="translate(60, 52)">
    <rect width="260" height="34" rx="17" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="36" y="22" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.5" text-transform="uppercase">DOKTRIN &amp; BATAS HAK</text>
  </g>

  <!-- Headline & Subtitle -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5">
      Klaim Bentuk &amp; Kebebasan Mendesain
    </text>
    <text x="0" y="32" fill="#94a3b8" font-size="16" font-weight="500">
      Seberapa Luas Perlindungan Desain Industri Ditentukan oleh Derajat Kebebasan
    </text>
  </g>

  <!-- LEFT PANEL: The Doctrine Rule Card -->
  <g transform="translate(60, 205)">
    <rect width="420" height="375" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Header of card -->
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 404 0 C 412.84 0 420 7.16 420 16 L 420 48 L 0 48 Z" fill="#1e293b"/>
    <text x="20" y="30" fill="#f8fafc" font-size="13" font-weight="700" letter-spacing="0.5">
      ATURAN HUKUM: GARIS TEGAS VS PUTUS-PUTUS
    </text>

    <!-- Item 1: Garis Tegas (Solid) -->
    <g transform="translate(20, 72)">
      <rect width="380" height="74" rx="10" fill="#0c192c" stroke="#0284c7" stroke-width="1"/>
      <line x1="20" y1="37" x2="65" y2="37" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
      <text x="80" y="30" fill="#ffffff" font-size="13" font-weight="700">Garis Tegas (Solid Line)</text>
      <text x="80" y="50" fill="#7dd3fc" font-size="11">Elemen rupa YANG DIKLAIM &amp; dilindungi hukum</text>
    </g>

    <!-- Item 2: Garis Putus-putus (Dashed) -->
    <g transform="translate(20, 160)">
      <rect width="380" height="74" rx="10" fill="#1c1917" stroke="#b45309" stroke-width="1"/>
      <line x1="20" y1="37" x2="65" y2="37" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4" stroke-linecap="round"/>
      <text x="80" y="30" fill="#ffffff" font-size="13" font-weight="700">Garis Putus-Putus (Dashed Line)</text>
      <text x="80" y="50" fill="#fcd34d" font-size="11">Konteks / lingkungan produk (TIDAK DIKLAIM)</text>
    </g>

    <!-- Inverse proportionality note -->
    <g transform="translate(20, 252)">
      <rect width="380" height="98" rx="10" fill="#0b1322" stroke="#1e293b" stroke-width="1"/>
      <text x="16" y="24" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="0.5">DOKTRIN PROPORSI TERBALIK (CJEU):</text>
      <text x="16" y="46" fill="#cbd5e1" font-size="11" line-height="1.4">
        • Kebebasan Sempit (Ponsel) → Beda kecil cukup beda
      </text>
      <text x="16" y="66" fill="#cbd5e1" font-size="11">
        • Kebebasan Luas (Lampu/Furnitur) → Cakupan luas
      </text>
      <text x="16" y="86" fill="#94a3b8" font-size="10" font-style="italic">
        Tolak ukur: Pemakai yang berpengetahuan (Informed User)
      </text>
    </g>
  </g>

  <!-- RIGHT PANEL: CAD 3D Drawing with Solid Claim vs Dashed Boundary -->
  <g transform="translate(520, 185)">
    <!-- Diagram Card Canvas -->
    <rect width="620" height="395" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>

    <!-- Diagram Header -->
    <text x="25" y="36" fill="#f8fafc" font-size="14" font-weight="700">
      ANATOMI DOKUMEN DESAIN INDUSTRI: BENTUK &amp; KONTUR
    </text>
    <text x="25" y="56" fill="#94a3b8" font-size="11">
      Visualisasi Perbandingan Klaim Bentuk 3D (Solid vs Disclaimed Context)
    </text>

    <!-- Technical Drawing Grid Area -->
    <g transform="translate(25, 75)">
      <rect width="570" height="295" rx="10" fill="#060c18" stroke="#1e293b" stroke-width="1"/>

      <!-- Blueprint Axis Lines -->
      <line x1="285" y1="15" x2="285" y2="280" stroke="#1e293b" stroke-dasharray="4 4" stroke-width="1"/>
      <line x1="20" y1="147" x2="550" y2="147" stroke="#1e293b" stroke-dasharray="4 4" stroke-width="1"/>

      <!-- LEFT OBJECT: Smart Device / Smartphone with Dashed Frame and Solid Unique Bevel -->
      <g transform="translate(60, 30)">
        <text x="75" y="16" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">OBJEK 1: KEBEBASAN TERBATAS</text>
        <text x="75" y="30" fill="#64748b" font-size="9" text-anchor="middle">(Standar Layar Datar Persegi)</text>

        <!-- Dashed Disclaimed Outer Housing -->
        <rect x="15" y="45" width="120" height="180" rx="18" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4"/>
        
        <!-- Solid Claimed Bezel & Camera Curve -->
        <rect x="25" y="55" width="100" height="160" rx="12" fill="#0f1f38" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowCyan)"/>
        <!-- Unique claimed curve feature -->
        <path d="M 45 68 C 65 68 85 68 105 68 C 112 68 116 72 116 80 L 116 100 C 116 108 112 112 105 112 L 45 112 Z" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="2"/>
        <circle cx="80" cy="90" r="12" fill="#0284c7" stroke="#e0f2fe" stroke-width="2"/>
        <circle cx="80" cy="90" r="5" fill="#ffffff"/>

        <text x="75" y="242" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Klaim: Lekuk Modul Kamera</text>
      </g>

      <!-- Center Divider Arrow -->
      <g transform="translate(255, 110)">
        <circle cx="30" cy="30" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <path d="M 22 30 L 38 30 M 32 24 L 38 30 L 32 36" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="30" y="68" fill="#64748b" font-size="9" text-anchor="middle" font-weight="600">KOMPARASI</text>
      </g>

      <!-- RIGHT OBJECT: High Design Freedom (Ergonomic Curvature / Sculptural Shell) -->
      <g transform="translate(360, 30)">
        <text x="85" y="16" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">OBJEK 2: KEBEBASAN LUAS</text>
        <text x="85" y="30" fill="#64748b" font-size="9" text-anchor="middle">(Bentuk Furnitur / Setrika Ergonomis)</text>

        <!-- Entire Sculptural Shell is Solid Claimed Lines -->
        <g transform="translate(10, 45)">
          <!-- 3D Form Contours -->
          <path d="M 15 130 C 10 70 50 30 110 30 C 145 30 155 55 155 80 C 155 120 120 145 60 145 C 30 145 15 130 15 130 Z" 
                fill="#064e3b" fill-opacity="0.35" stroke="#34d399" stroke-width="3" filter="url(#glowCyan)"/>
          
          <!-- Ergonomic Spine Ribs -->
          <path d="M 35 110 C 45 75 80 50 125 50" fill="none" stroke="#6ee7b7" stroke-width="2"/>
          <path d="M 45 125 C 65 95 95 75 140 75" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-dasharray="3 2"/>
          <path d="M 60 138 C 80 115 110 100 148 100" fill="none" stroke="#6ee7b7" stroke-width="1.5"/>

          <!-- Base Plate / Surface -->
          <ellipse cx="85" cy="155" rx="70" ry="16" fill="#042f2e" stroke="#10b981" stroke-width="2"/>
        </g>

        <text x="95" y="242" fill="#34d399" font-size="10" font-weight="600" text-anchor="middle">Klaim Penuh: Skulptural 3D</text>
      </g>

      <!-- Bottom Spectrum Strip -->
      <g transform="translate(20, 260)">
        <rect width="530" height="22" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="15" y="15" fill="#f59e0b" font-size="9" font-weight="700">SPEKTRUM KEBEBASAN:</text>
        <text x="145" y="15" fill="#94a3b8" font-size="9">Ponsel Pintar (Sempit)</text>
        <line x1="260" y1="11" x2="380" y2="11" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
        <text x="390" y="15" fill="#34d399" font-size="9" font-weight="700">Furnitur &amp; Lampu (Sangat Luas)</text>
      </g>

    </g>
  </g>

  <!-- Bottom Brand Mark -->
  <g transform="translate(60, 615)">
    <text x="0" y="18" fill="#475569" font-size="12" font-mono="true">
      IDE INDONESIA &#8226; SERI DOKTRIN &amp; BATAS PERLINDUNGAN DESAIN INDUSTRI &#8226; OLEH ARIF REZA BASIRUN
    </text>
  </g>
</svg>
