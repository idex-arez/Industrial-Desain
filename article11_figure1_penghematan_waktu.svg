<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#ffffff; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <filter id="shadowAM1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="627" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadowAM1)"/>

  <!-- TOP HEADER -->
  <g transform="translate(60, 58)">
    <rect width="280" height="28" rx="6" fill="#e0f2fe"/>
    <text x="12" y="19" fill="#0369a1" font-size="11" font-weight="800" font-mono="true" letter-spacing="1">
      GAMBAR 1 &#8226; RISSET &amp; PENGEMBANGAN AM
    </text>

    <text x="0" y="60" fill="#0f172a" font-size="28" font-weight="800" letter-spacing="-0.5">
      AM Memangkas Waktu 64% sampai 93% pada Kasus yang Dilaporkan
    </text>
    <text x="0" y="86" fill="#64748b" font-size="14" font-weight="500">
      Perbandingan Penghematan Waktu Siklus Prototipe vs Perkakas Konvensional
    </text>
  </g>

  <!-- BAR CHART CONTAINER -->
  <g transform="translate(60, 175)">
    <rect width="1080" height="410" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadowAM1)"/>

    <!-- Row 1: Wadah pemanis -->
    <g transform="translate(30, 25)">
      <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="700">Wadah pemanis (waktu tunggu)</text>
      <text x="1020" y="16" fill="#0369a1" font-size="14" font-weight="800" font-mono="true" text-anchor="end">93%</text>
      <rect x="0" y="24" width="1020" height="24" rx="6" fill="#f1f5f9"/>
      <rect x="0" y="24" width="948" height="24" rx="6" fill="#0f766e"/>
    </g>

    <!-- Row 2: Corong inlet kipas -->
    <g transform="translate(30, 95)">
      <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="700">Corong inlet kipas (waktu tunggu)</text>
      <text x="1020" y="16" fill="#0369a1" font-size="14" font-weight="800" font-mono="true" text-anchor="end">87%</text>
      <rect x="0" y="24" width="1020" height="24" rx="6" fill="#f1f5f9"/>
      <rect x="0" y="24" width="887" height="24" rx="6" fill="#0d9488"/>
    </g>

    <!-- Row 3: Komponen proyektor -->
    <g transform="translate(30, 165)">
      <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="700">Komponen proyektor (waktu tunggu)</text>
      <text x="1020" y="16" fill="#0369a1" font-size="14" font-weight="800" font-mono="true" text-anchor="end">78%</text>
      <rect x="0" y="24" width="1020" height="24" rx="6" fill="#f1f5f9"/>
      <rect x="0" y="24" width="795" height="24" rx="6" fill="#14b8a6"/>
    </g>

    <!-- Row 4: Cincin mesin cuci -->
    <g transform="translate(30, 235)">
      <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="700">Cincin mesin cuci (waktu prototipe)</text>
      <text x="1020" y="16" fill="#0369a1" font-size="14" font-weight="800" font-mono="true" text-anchor="end">69%</text>
      <rect x="0" y="24" width="1020" height="24" rx="6" fill="#f1f5f9"/>
      <rect x="0" y="24" width="703" height="24" rx="6" fill="#2dd4bf"/>
    </g>

    <!-- Row 5: Komponen Idaho Steel -->
    <g transform="translate(30, 305)">
      <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="700">Komponen Idaho Steel (250 jam jadi 90)</text>
      <text x="1020" y="16" fill="#0369a1" font-size="14" font-weight="800" font-mono="true" text-anchor="end">64%</text>
      <rect x="0" y="24" width="1020" height="24" rx="6" fill="#f1f5f9"/>
      <rect x="0" y="24" width="652" height="24" rx="6" fill="#5eead4"/>
    </g>

    <!-- Bottom note -->
    <text x="30" y="380" fill="#64748b" font-size="11" font-style="italic">
      Data kasus vendor dan artikel teknik (Stratasys [2], Machine Design [4]); hasil menunjukkan arah efisiensi, bukan jaminan untuk setiap produk.
    </text>
  </g>

  <!-- FOOTER -->
  <g transform="translate(60, 620)">
    <text x="0" y="14" fill="#94a3b8" font-size="11" font-mono="true">
      Sumber: Stratasys [2]; Machine Design [4] &#8226; Kajian IDE Indonesia oleh Arif Reza Basirun
    </text>
  </g>
</svg>
